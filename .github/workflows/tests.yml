name: tests

on:
  push:
  pull_request:

jobs:
  r-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install R and packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            r-base-core r-cran-data.table r-cran-dplyr r-cran-tidyr r-cran-stringr
      - name: Run tests
        run: Rscript tests/test_utils.R
