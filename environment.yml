# Main environment: Snakemake, plus R and the packages used by the scripts in R/.
# Create with:  conda env create -f environment.yml && conda activate blautia-screen
name: blautia-screen
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake=8
  - r-base=4.3
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-ggplot2
  - r-pheatmap
  - r-rcolorbrewer
  - r-ggtext
  - r-patchwork
